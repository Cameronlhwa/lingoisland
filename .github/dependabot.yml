version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Keep related framework packages together, including major upgrades.
      next-react:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      # Other major upgrades get individual PRs for focused review.
      production-minor-patch:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
